server {
    listen 40081 default_server;
    listen [::]:40081 default_server;

    server_name seman.mesnaissances.com;

    root /opt/serge-mane/website;
    index index.html index.htm;

    access_log /var/log/nginx/website-access.log;
    error_log /var/log/nginx/website-error.log;

    # 🔐 Sécurité : bloquer l'accès aux fichiers sensibles
    location ~ /\.(git|env|config\.json|htaccess) {
        deny all;
    }

    # 🔁 API : proxy vers le backend
    location /api/ {
        proxy_pass http://127.0.0.1:40082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🌐 Fichiers statiques
    location / {
        try_files $uri $uri/ =404;
    }

    # 📦 Optimisation : cache pour les fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
