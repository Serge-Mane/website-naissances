    name: deploy application
    run-name: ${{ github.actor }} is deploying front-end 🚀
    on:
       push:
       workflow_dispatch:
    env:
      GROUP: /opt/serge-mane
      PROJECT: website
    jobs:
      create-folder:
        name: Create folder on server
        runs-on: ubuntu-latest
        steps:
          - name: Execute remote SSH commands
            uses: appleboy/ssh-action@v1
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              script: |
                 sudo mkdir -p ${{env.GROUP}}/${{env.PROJECT}}
      build-project:
        needs: create-folder
        runs-on: ubuntu-latest
        steps:
          - name: Check out repository code
            uses: actions/checkout@v4

          - name: build project
            run: |
              npm install
              npm run build

          - name: copy file on server
            uses: appleboy/scp-action@v1
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              source: dist
              target: ${{env.GROUP}}/${{env.PROJECT}}
              strip_components: 1
              overwrite: true
      run-project:
        name: run project on server
        runs-on: ubuntu-24.04
        needs: build-project
        steps:
          - name: Check out repository code
            uses: actions/checkout@v4
          - name: copy configurations file on t server
            uses: appleboy/scp-action@v0.1.7
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              source: sam.conf
              target: /etc/nginx/conf.d
              overwrite: true
          - name: executing remote ssh commands
            uses: appleboy/ssh-action@v1
            with:
              host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              script: |
                sudo nginx -t
                sudo service nginx restart
