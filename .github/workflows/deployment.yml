    name: deploy application
    run-name: ${{ github.actor }} is deploying front 🚀
    on:
       push:
       workflow_dispatch:
    env:
      GROUP: /opt/serge-mane
      PROJECT: website-naissances
    jobs:
      create-folder:
        name: Create folder on server
        runs-on: ubuntu-latest
        steps:
          - name: Execute remote SSH commands
            uses: appleboy/ssh-action@v1
            with:
              host: ${{ secrets.SERVER_HOST }}
              port: ${{ secrets.SERVER_PORT }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              script: |
                 sudo mkdir -p ${{env.GROUP}}/${{env.PROJECT}}
      build-project:
        needs: create-folder
        runs-on: ubuntu-latest
        steps:
          - name: Check out repository code
            uses: actions/checkout@v4

          - name: build project
            run: |
              npm run build

          - name: copy file on servers
            uses: appleboy/scp-action@v1
            with:
              host: ${{ secrets.SERVER_HOST }}
              port: ${{ secrets.SERVER_PORT }}
              username: ${{ secrets.SERVER_USERNAME }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              source: dist
              target: ${{env.GROUP}}/${{env.PROJECT}}
              strip_components: 1
              overwrite: true